name: repro

# The iterate loop: patch vendor/wgpu/naga (the WGSL->MSL backend), push, and
# the `metal` job below re-runs on a real Apple-Silicon Metal device. The
# `vulkan` job is the control — the same WGSL is correct there.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  metal:
    # NOTE: currently PASSES — the isolated 3 kernels are NOT the bug (see README
    # STATUS). Will go red once the upstream producing kernels are added and the
    # trigger is captured; that's the worker's bisect target.
    name: Metal (macos-latest, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU info
        run: system_profiler SPDisplaysDataType | head -40 || true
      - name: Capture Metal WGSL + compile diagnostics
        # CUBECL_DEBUG_LOG dumps the per-kernel WGSL; RUST_LOG surfaces cubecl-wgpu's
        # shader-compile path/errors (e.g. an f64 module wgpu/naga rejects on Metal),
        # which otherwise manifests only as silent uninitialized-buffer garbage.
        env:
          CUBECL_DEBUG_LOG: stdout
          RUST_LOG: cubecl_wgpu=trace,wgpu=warn,wgpu_core=warn,naga=warn
        run: cargo run --release --no-default-features --features wgpu > metal_run.log 2>&1 || true
      - name: Upload Metal WGSL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-wgsl
          path: metal_run.log
      - name: Run repro on Metal
        # wgpu picks Metal on macOS. Exit code 1 == the bug still reproduces.
        run: cargo run --release --no-default-features --features wgpu

  vulkan:
    name: Vulkan (ubuntu, llvmpipe) — control, EXPECTED PASS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan (lavapipe software rasterizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary | head -30 || true
      - name: Run repro on Vulkan
        # Same WGSL, correct here — proves the bug is Metal-only (naga MSL).
        run: cargo run --release --no-default-features --features wgpu
