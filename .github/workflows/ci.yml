name: repro

# RESOLVED: the trigger is `f64`, which Apple Metal does not support (no
# SHADER_F64). cubecl emits f64 WGSL anyway; wgpu rejects it at
# create_shader_module; the launch no-ops and leaves buffers uninitialized ->
# garbage. naga is innocent. See README.md. The `metal` job stays red until the
# producer uses f32 (zensim-gpu fix) or cubecl downgrades/errors on f64. The
# `vulkan` job is the control — those backends have f64, so they pass.
on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal:
    # FAILS (expected): the feature/blur+f64 producers use f64, which Metal can't
    # validate. host-upload / relay / blur-only producers PASS. See README.
    name: Metal (macos-latest, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU info
        run: system_profiler SPDisplaysDataType | head -40 || true
      - name: Capture Metal WGSL + compile diagnostics
        # CUBECL_DEBUG_LOG dumps the per-kernel WGSL; RUST_LOG surfaces cubecl-wgpu's
        # shader-compile path/errors (e.g. an f64 module wgpu/naga rejects on Metal),
        # which otherwise manifests only as silent uninitialized-buffer garbage.
        env:
          CUBECL_DEBUG_LOG: stdout
          RUST_LOG: cubecl_wgpu=trace,wgpu=warn,wgpu_core=warn,naga=warn
          # cubecl now STRICTLY errors on f64 for a no-SHADER_F64 device unless
          # pre-authorized; authorize so the f64 feature kernels downgrade to f32
          # and run (instead of aborting), letting the run reach the df64 probe.
          CUBECL_ALLOW_F64_DOWNGRADE: "1"
        run: cargo run --release --no-default-features --features wgpu > metal_run.log 2>&1 || true
      - name: Upload Metal WGSL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-wgsl
          path: metal_run.log
      - name: Run repro on Metal
        # wgpu picks Metal on macOS. The df64 per-kernel fast-math probe is the
        # check: the `precise` kernel recovers ~4096, the non-precise one collapses.
        env:
          CUBECL_ALLOW_F64_DOWNGRADE: "1"
        run: cargo run --release --no-default-features --features wgpu

  vulkan:
    name: Vulkan (ubuntu, llvmpipe) — control, EXPECTED PASS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan (lavapipe software rasterizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary | head -30 || true
      - name: Run repro on Vulkan
        # Same WGSL, correct here — proves the bug is Metal-only (naga MSL).
        run: cargo run --release --no-default-features --features wgpu
