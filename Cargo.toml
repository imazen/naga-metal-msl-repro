[package]
name = "naga-metal-msl-repro"
version = "0.0.0"
edition = "2024"
publish = false
description = "Standalone repro of a naga WGSL->MSL miscompile on Apple Metal (correct on Vulkan + CUDA)"

[features]
default = ["wgpu"]
cuda = ["cubecl/cuda"]
wgpu = ["cubecl/wgpu"]
cpu  = ["cubecl/cpu"]

[dependencies]
# The repro is generated by cubecl (imazen's published `zenforks-cubecl` fork,
# which tracks tracel-ai/cubecl 0.10.x). cubecl-wgpu pulls wgpu 29.0.3 -> naga
# 29.0.3 — the crate the bug lives in, overridden below to the in-repo fork.
cubecl = { package = "zenforks-cubecl", version = "0.10.1", default-features = false, features = ["std"] }
# Surfaces cubecl-wgpu's `log::error!("WGSL compilation failed …")` so a silent
# shader-compile failure on Metal (e.g. an f64 module wgpu/naga rejects) is
# visible instead of manifesting only as uninitialized-buffer garbage downstream.
env_logger = "0.11.10"

[[bin]]
name = "naga-metal-msl-repro"
path = "src/main.rs"

# Override naga with the forked submodule (gfx-rs/wgpu @ v29.0.3, branch
# `naga-metal-msl-repro`). Patch the WGSL->MSL backend in `vendor/wgpu/naga/`
# and re-run — CI rebuilds it on a real Metal device.
[patch.crates-io]
naga = { path = "vendor/wgpu/naga" }
# EXPERIMENT: the whole wgpu stack is vendored so wgpu-hal's Metal fast-math
# disable (MTLCompileOptions.setFastMathEnabled(false)) takes effect — that lets
# the df64 software-double-precision probe survive on Metal. All must be patched
# together to keep wgpu-types/wgpu-core/wgpu-hal versions consistent.
wgpu = { path = "vendor/wgpu/wgpu" }
wgpu-core = { path = "vendor/wgpu/wgpu-core" }
wgpu-hal = { path = "vendor/wgpu/wgpu-hal" }
wgpu-types = { path = "vendor/wgpu/wgpu-types" }
wgpu-naga-bridge = { path = "vendor/wgpu/wgpu-naga-bridge" }
# cubecl fork with the per-kernel fast-math control (#[cube(precise)] ->
# KernelOptions.fast_math -> wgpu ShaderRuntimeChecks.fast_math -> Metal
# MTLCompileOptions). git branch so CI can build it on the Metal runner.
zenforks-cubecl = { git = "https://github.com/imazen/zenforks-cubecl", branch = "feat-per-kernel-fast-math" }

[profile.release]
debug = false
